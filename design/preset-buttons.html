<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CanaryEQ Preset Buttons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-0: #050c18;
    --navy-1: #0b1a30;
    --navy-2: #132a4a;
    --text: #e8eef7;
    --muted: #7f93ad;
    --station: #ff7fb6;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, #1d3a63, var(--navy-0) 70%);
    color: var(--text);
    font-family: "Segoe UI", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  .stage { position: absolute; left: 50%; top: 50%; width: 980px; height: 560px; transform: translate(-50%, -50%); }
  .window {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(180deg, var(--navy-2), var(--navy-1) 30%, var(--navy-0));
    box-shadow: 0 0 0 1px #3a5a88, 0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15);
    padding: 20px 24px;
  }

  .lcd {
    position: relative;
    height: 220px;
    border-radius: 14px;
    padding: 18px 24px;
    background:
      radial-gradient(circle, rgba(255,255,255,.05) 0 1px, transparent 1.3px) 0 0 / 4px 4px,
      radial-gradient(ellipse at 30% 0%, color-mix(in srgb, var(--station) 16%, #0c1626), #060b14 75%);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--station) 45%, #1d3556), inset 0 2px 12px rgba(0,0,0,.7);
    font-family: "Share Tech Mono", monospace;
    color: var(--station);
    text-shadow: 0 0 10px color-mix(in srgb, var(--station) 60%, transparent);
    transition: color .5s, box-shadow .5s, background .5s;
    display: grid;
    grid-template-columns: 330px 1fr;
    gap: 24px;
  }
  .lcd .meta { font-size: 11px; letter-spacing: .06em; color: color-mix(in srgb, var(--station) 45%, #3c4d63); text-shadow: none; }
  .lcd .memory { margin-top: 10px; font-size: 15px; letter-spacing: .1em; }
  .lcd .freq { font-size: 72px; line-height: 1; margin-top: 2px; }
  .lcd .freq small { font-size: 16px; margin-left: 6px; opacity: .6; }
  .lcd .name { font-size: 22px; margin-top: 4px; letter-spacing: .08em; }
  .lcd .values { margin-top: 14px; font-size: 13px; color: color-mix(in srgb, var(--station) 70%, #556); }
  .lcd .values b { font-weight: normal; color: var(--station); }
  .lcd .right { display: grid; grid-template-rows: 1fr auto; }
  .lcd svg { width: 100%; height: 130px; align-self: center; }
  .lcd path { fill: none; stroke: var(--station); stroke-width: 3; transition: stroke .5s; filter: drop-shadow(0 0 6px var(--station)); }
  .status { text-align: right; font-size: 13px; letter-spacing: .08em; min-height: 18px; }
  .status.blink { animation: blink .5s steps(2) 4; }
  @keyframes blink { 50% { opacity: 0; } }
  .modified { display: inline-block; margin-left: 10px; padding: 0 6px; border: 1px solid currentColor; border-radius: 3px; font-size: 11px; opacity: 0; transition: opacity .3s; }
  .modified.on { opacity: 1; }

  .row-title { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 12px; }
  .row-title h2 { font-size: 13px; letter-spacing: .16em; }
  .row-title span { color: var(--muted); font-size: 12px; }
  .tweak {
    border: none;
    border-radius: 999px;
    padding: 7px 14px;
    font: 600 12px "Segoe UI", sans-serif;
    color: #dbe9ff;
    background: linear-gradient(180deg, #2b5d9e, #173a68);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 6px rgba(0,0,0,.4);
    cursor: pointer;
  }

  .presets {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    padding: 16px;
    border-radius: 14px;
    background: linear-gradient(180deg, #08111f, #0d1c33);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.6), 0 0 0 1px #1d365a;
  }
  .preset { display: grid; gap: 8px; }
  .label {
    height: 38px;
    border-radius: 6px;
    padding: 4px 8px;
    background: #050a12;
    box-shadow: inset 0 0 0 1px #1a2b45;
    font: 12px "Share Tech Mono", monospace;
    color: color-mix(in srgb, var(--c) 55%, #4a5a70);
    display: grid;
    align-content: center;
    transition: color .3s, box-shadow .3s;
  }
  .label b { font-weight: normal; font-size: 13px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preset.active .label { color: var(--c); text-shadow: 0 0 8px color-mix(in srgb, var(--c) 60%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, #1a2b45); }

  .button {
    position: relative;
    height: 86px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    background: linear-gradient(180deg, #3d4f6b 0%, #23324a 48%, #18243a 52%, #1f2d44 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,.35),
      inset 0 -3px 0 rgba(0,0,0,.35),
      0 6px 0 #0a1324,
      0 9px 14px rgba(0,0,0,.6);
    color: #dfe7f2;
    font: 700 30px "Segoe UI", sans-serif;
    text-shadow: 0 1px 1px rgba(0,0,0,.6);
    transition: transform .08s, box-shadow .08s;
    overflow: hidden;
  }
  .button::before {
    content: "";
    position: absolute;
    left: 14px;
    right: 14px;
    top: 9px;
    height: 4px;
    border-radius: 2px;
    background: #0b1424;
    box-shadow: inset 0 1px 2px rgba(0,0,0,.8);
    transition: background .3s, box-shadow .3s;
  }
  .button::after {
    content: "";
    position: absolute;
    inset: 0 0 50% 0;
    border-radius: 12px 12px 40% 40% / 12px 12px 14px 14px;
    background: linear-gradient(180deg, rgba(255,255,255,.22), rgba(255,255,255,0));
    pointer-events: none;
  }
  .preset.active .button {
    transform: translateY(4px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.2), inset 0 -2px 0 rgba(0,0,0,.35), 0 2px 0 #0a1324, 0 3px 6px rgba(0,0,0,.6);
  }
  .preset.active .button::before { background: var(--c); box-shadow: 0 0 10px var(--c), 0 0 2px #fff inset; }
  .button:active { transform: translateY(5px); box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 1px 0 #0a1324; }
  .fill {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, color-mix(in srgb, var(--c) 35%, transparent), color-mix(in srgb, var(--c) 55%, transparent));
    pointer-events: none;
  }
  .button span { position: relative; }
  .button small { position: absolute; bottom: 8px; left: 0; right: 0; font: 600 9px "Segoe UI", sans-serif; letter-spacing: .14em; color: #8ea2bd; text-shadow: none; }

  .footer { margin-top: 16px; text-align: center; color: var(--muted); font-size: 12px; }
  .footer b { color: #c9d6e6; font-weight: 600; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="window">
    <div class="lcd">
      <div>
        <div class="meta">HEADPHONES · MOONDROP DAWN PRO · 48 KHZ</div>
        <div class="memory" id="memory">MEMORY 1<span class="modified" id="modified">EDITED</span></div>
        <div class="freq" id="freq">88.4<small>MHz</small></div>
        <div class="name" id="name">DAWN PRO</div>
        <div class="values" id="values"></div>
      </div>
      <div class="right">
        <svg viewBox="0 0 400 130" preserveAspectRatio="none"><path id="curve"/></svg>
        <div class="status" id="status"></div>
      </div>
    </div>

    <div class="row-title">
      <h2>PRESETS</h2>
      <span>aperte pra sintonizar · <b>segure 1,5 s</b> pra gravar o som atual</span>
      <button class="tweak" id="tweak">mexer no som (simula ajuste nos knobs)</button>
    </div>

    <div class="presets" id="presets"></div>
    <div class="footer">Igual ao rádio do carro: <b>aperta</b> = muda de estação · <b>segura</b> = grava a estação no botão</div>
  </div>
</div>

<script>
  const HOLD_MS = 1500;
  const presets = [
    { freq: "88.4", name: "Dawn Pro", color: "#ff7fb6", eq: [0.8, 0.3, -1.0] },
    { freq: "91.2", name: "Late Night", color: "#d7dde6", eq: [1.5, -0.7, -3.7] },
    { freq: "94.7", name: "Valorant", color: "#ff6153", eq: [-1.0, 2.0, 1.5] },
    { freq: "99.1", name: "Podcasts", color: "#5fd38a", eq: [-2.0, 3.0, 0.0] },
    { freq: "103.5", name: "Discord", color: "#9b8cff", eq: [-1.0, 1.5, 0.5] },
    { freq: "107.0", name: "My Mix", color: "#4fd2ff", eq: [2.0, 0.0, 1.5] },
  ];
  const state = { active: 0, current: [...presets[0].eq] };

  const signed = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}`;
  const curve = ([bass, mid, treble]) => {
    const y = v => 65 - v * 7;
    return `M0 ${y(bass)} C80 ${y(bass)} 120 ${y(bass)} 160 ${y((bass + mid) / 2)} S220 ${y(mid)} 260 ${y(mid)} S340 ${y(treble)} 400 ${y(treble)}`;
  };
  const sameSound = (a, b) => a.every((v, i) => Math.abs(v - b[i]) < 0.05);

  const presetsRoot = document.getElementById("presets");
  const render = () => {
    const preset = presets[state.active];
    document.documentElement.style.setProperty("--station", preset.color);
    document.getElementById("freq").innerHTML = `${preset.freq}<small>MHz</small>`;
    document.getElementById("name").textContent = preset.name.toUpperCase();
    document.getElementById("memory").firstChild.textContent = `MEMORY ${state.active + 1}`;
    document.getElementById("modified").classList.toggle("on", !sameSound(state.current, preset.eq));
    const [bass, mid, treble] = state.current;
    document.getElementById("values").innerHTML = `BASS <b>${signed(bass)}</b> · VOCALS <b>${signed(mid)}</b> · TREBLE <b>${signed(treble)}</b>`;
    document.getElementById("curve").setAttribute("d", curve(state.current));
    presetsRoot.querySelectorAll(".preset").forEach((element, i) => {
      element.classList.toggle("active", i === state.active);
      element.querySelector(".label").innerHTML = `${presets[i].freq}<b>${presets[i].name}</b>`;
    });
  };

  const flash = text => {
    const status = document.getElementById("status");
    status.textContent = text;
    status.classList.remove("blink");
    void status.offsetWidth;
    status.classList.add("blink");
  };

  presets.forEach((preset, index) => {
    const element = document.createElement("div");
    element.className = "preset";
    element.style.setProperty("--c", preset.color);
    element.innerHTML = `<div class="label"></div><button class="button"><div class="fill"></div><span>${index + 1}</span><small>HOLD TO SAVE</small></button>`;
    const button = element.querySelector(".button");
    const fill = element.querySelector(".fill");
    let timer = null;
    let start = 0;
    let saved = false;

    const animate = () => {
      const progress = Math.min(1, (performance.now() - start) / HOLD_MS);
      fill.style.width = `${progress * 100}%`;
      if (progress >= 1 && !saved) {
        saved = true;
        presets[index].eq = [...state.current];
        if (!state.current.every((v, i) => v === preset.eq[i])) {
          presets[index].name = presets[index].name.startsWith("My Mix") ? presets[index].name : `My Mix ${index + 1}`;
        }
        state.active = index;
        render();
        flash(`★ SAVED TO MEMORY ${index + 1}`);
        return;
      }
      if (!saved) timer = requestAnimationFrame(animate);
    };

    button.addEventListener("pointerdown", () => {
      saved = false;
      start = performance.now();
      timer = requestAnimationFrame(animate);
    });
    const release = () => {
      cancelAnimationFrame(timer);
      fill.style.width = "0%";
      if (!saved && start) {
        state.active = index;
        state.current = [...presets[index].eq];
        render();
        flash(`TUNED · MEMORY ${index + 1}`);
      }
      start = 0;
    };
    button.addEventListener("pointerup", release);
    button.addEventListener("pointerleave", () => {
      if (start && !saved) {
        cancelAnimationFrame(timer);
        fill.style.width = "0%";
        start = 0;
      }
    });
    presetsRoot.appendChild(element);
  });

  document.getElementById("tweak").addEventListener("click", () => {
    state.current = state.current.map(v => Math.max(-12, Math.min(12, Math.round((v + (Math.random() * 6 - 3)) * 2) / 2)));
    render();
    flash("SOUND EDITED · HOLD A BUTTON TO SAVE");
  });

  const fit = () => {
    const scale = Math.min(1, (innerWidth - 20) / 1000, (innerHeight - 20) / 580);
    document.getElementById("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
  };
  addEventListener("resize", fit);
  fit();
  render();

  const params = new URLSearchParams(location.search);
  if (params.has("press")) {
    state.active = Number(params.get("press"));
    state.current = [...presets[state.active].eq];
    render();
    flash(`TUNED · MEMORY ${state.active + 1}`);
  }
  if (params.has("edited")) {
    state.current = [3.0, -1.5, 2.0];
    render();
    flash("SOUND EDITED · HOLD A BUTTON TO SAVE");
  }
  if (params.has("holding")) {
    const holding = presetsRoot.querySelectorAll(".preset")[Number(params.get("holding"))];
    holding.querySelector(".fill").style.width = "65%";
  }
</script>
</body>
</html>
