<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CanaryEQ Head Unit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --station: #ff7fb6;
    --chrome: linear-gradient(180deg, #fdfdfd 0%, #c9ced6 22%, #7d8693 50%, #e6e9ee 78%, #a9b0ba 100%);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 30%, #2a2f38, #0b0d10 75%);
    font-family: "Segoe UI", sans-serif;
    color: #dfe6ef;
    overflow: hidden;
    user-select: none;
  }
  .stage { position: absolute; left: 50%; top: 50%; width: 1060px; height: 470px; transform: translate(-50%, -50%); }

  .unit {
    position: absolute;
    inset: 0;
    border-radius: 22px;
    padding: 6px;
    background: var(--chrome);
    box-shadow: 0 30px 70px rgba(0,0,0,.7);
  }
  .face {
    position: relative;
    height: 100%;
    border-radius: 17px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,0) 18%),
      linear-gradient(180deg, #1b1f26, #0a0c10 60%, #121520);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 6px rgba(0,0,0,.8);
    display: grid;
    grid-template-columns: 230px 1fr 190px;
    grid-template-rows: 300px 1fr;
    gap: 0 18px;
    padding: 22px 26px 22px 22px;
  }

  .silk { position: absolute; font: 600 10px "Segoe UI", sans-serif; letter-spacing: .18em; color: #8b95a3; }
  .badge {
    position: absolute;
    top: 14px;
    right: 26px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 3px 12px 3px 6px;
    border-radius: 999px;
    background: var(--chrome);
    box-shadow: 0 1px 2px rgba(0,0,0,.6);
    font: 800 13px "Segoe UI", sans-serif;
    color: #1a2433;
  }
  .badge img { width: 22px; height: 22px; }
  .badge span { color: #1f5fb2; }

  .left { grid-row: 1 / 3; display: grid; place-items: center; position: relative; }
  .ring {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    background: conic-gradient(from 225deg, var(--station) calc(var(--level) * 270deg), #1d222b 0 270deg, transparent 0);
    filter: drop-shadow(0 0 14px color-mix(in srgb, var(--station) 70%, transparent));
    transition: filter .5s;
    display: grid;
    place-items: center;
    cursor: ns-resize;
  }
  .ring::before { content: ""; position: absolute; inset: 12px; border-radius: 50%; background: #07090c; }
  .knob {
    position: relative;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, #ffffff, #8d96a3, #f3f5f8, #7b8491, #fbfcfd, #959ead, #eef1f5, #848d9a, #ffffff);
    box-shadow: 0 6px 14px rgba(0,0,0,.7), inset 0 0 0 3px rgba(255,255,255,.4);
  }
  .knob::before { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #3a414c, #0d1014 70%); box-shadow: inset 0 2px 6px rgba(0,0,0,.9), 0 0 0 2px #b7bfca; }
  .knob .dot { position: absolute; left: 50%; top: 30px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--station); box-shadow: 0 0 8px var(--station); transform-origin: 4px 45px; }
  .knob-label { position: absolute; bottom: 34px; font: 600 10px "Segoe UI", sans-serif; letter-spacing: .2em; color: #8b95a3; }

  .bezel {
    grid-column: 2;
    grid-row: 1;
    margin-top: 26px;
    border-radius: 12px;
    padding: 6px;
    background: var(--chrome);
    box-shadow: 0 2px 6px rgba(0,0,0,.7);
  }
  .lcd {
    position: relative;
    height: 100%;
    border-radius: 8px;
    padding: 14px 18px 12px;
    background:
      radial-gradient(circle, rgba(0,0,0,.35) 0 1px, transparent 1.4px) 0 0 / 3px 3px,
      radial-gradient(ellipse at 40% 0%, color-mix(in srgb, var(--station) 22%, #0a0d12), #040507 80%);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.9);
    color: var(--station);
    font-family: "DotGothic16", monospace;
    text-shadow: 0 0 8px color-mix(in srgb, var(--station) 70%, transparent);
    transition: color .5s, background .5s;
    overflow: hidden;
  }
  .lcd::after { content: ""; position: absolute; inset: 0 0 55% 0; background: linear-gradient(180deg, rgba(255,255,255,.07), transparent); pointer-events: none; }
  .lcd-top { display: flex; justify-content: space-between; font-size: 12px; opacity: .55; letter-spacing: .08em; }
  .lcd-main { display: flex; align-items: flex-end; gap: 18px; margin-top: 4px; }
  .lcd-main .freq { font-size: 64px; line-height: .95; letter-spacing: .02em; }
  .lcd-main .line { display: grid; padding-bottom: 6px; }
  .lcd-main .name { font-size: 26px; letter-spacing: .12em; }
  .lcd-main .sub { font-size: 13px; opacity: .65; letter-spacing: .08em; }
  .tags { display: flex; gap: 6px; margin-left: auto; padding-bottom: 8px; align-self: flex-start; margin-top: 8px; }
  .tags span { font: 10px "Share Tech Mono", monospace; border: 1px solid currentColor; border-radius: 2px; padding: 0 4px; opacity: .3; }
  .tags span.on { opacity: 1; }
  .bars { display: flex; gap: 3px; height: 62px; align-items: flex-end; margin-top: 10px; }
  .bars i { flex: 1; background: repeating-linear-gradient(0deg, var(--station) 0 4px, transparent 4px 6px); opacity: .85; }
  .scale { position: relative; margin-top: 8px; height: 26px; border-top: 1px solid color-mix(in srgb, var(--station) 30%, transparent); }
  .scale span { position: absolute; top: 4px; transform: translateX(-50%); font-size: 11px; opacity: .55; white-space: nowrap; }
  .scale span.on { opacity: 1; }
  .needle { position: absolute; top: -70px; bottom: 0; width: 2px; background: #ff3b30; box-shadow: 0 0 6px #ff3b30; transition: left .5s cubic-bezier(.3,.9,.3,1); }
  .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: #040507; font-size: 40px; letter-spacing: .12em; opacity: 0; transition: opacity .15s; pointer-events: none; }
  .overlay.show { opacity: 1; }

  .right { grid-column: 3; grid-row: 1; display: grid; grid-template-rows: repeat(3, 1fr); align-items: center; padding-top: 30px; }
  .tone { display: grid; grid-template-columns: 68px 1fr; align-items: center; gap: 12px; }
  .small-knob {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: repeating-conic-gradient(#2b3038 0 6deg, #15181d 6deg 12deg);
    box-shadow: 0 4px 8px rgba(0,0,0,.7), inset 0 0 0 2px #3a414b;
    cursor: ns-resize;
  }
  .small-knob::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: radial-gradient(circle at 40% 30%, #3d444f, #14171c); box-shadow: inset 0 1px 0 rgba(255,255,255,.2); }
  .small-knob .mark { position: absolute; left: 50%; top: 8px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: #e9edf2; transform-origin: 2px 24px; }
  .tone-text b { display: block; font-size: 11px; letter-spacing: .18em; color: #c7cfda; }
  .tone-text small { display: block; font-size: 10px; color: #6f7a89; margin-top: 2px; }
  .tone-text output { display: block; font: 15px "Share Tech Mono", monospace; color: var(--station); margin-top: 3px; transition: color .5s; }

  .balance { grid-column: 2; grid-row: 2; align-self: start; margin-top: 14px; display: grid; grid-template-columns: 70px 1fr 18px; align-items: center; gap: 10px; }
  .balance label { font-size: 10px; letter-spacing: .2em; color: #8b95a3; }
  .track { position: relative; height: 30px; border-radius: 4px; background: #050608; box-shadow: inset 0 2px 5px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.08); cursor: ew-resize; }
  .track .numbers { position: absolute; inset: 0 14px; display: flex; justify-content: space-between; align-items: center; font: 11px "Share Tech Mono", monospace; color: #7f8a99; }
  .thumb { position: absolute; top: -4px; width: 30px; height: 38px; margin-left: -15px; border-radius: 4px; background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(220,230,240,.25) 45%, rgba(255,255,255,.4)); box-shadow: 0 2px 6px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.6); backdrop-filter: blur(1px); transition: left .1s; }
  .thumb::after { content: ""; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 2px; margin-left: -1px; background: var(--station); box-shadow: 0 0 6px var(--station); }

  .presets { grid-column: 2 / 4; grid-row: 2; align-self: end; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  .preset {
    position: relative;
    height: 58px;
    border: none;
    border-radius: 6px 6px 10px 10px;
    cursor: pointer;
    background: linear-gradient(180deg, #2f343d 0%, #181b21 55%, #101216 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 5px 0 #050608, 0 7px 10px rgba(0,0,0,.6);
    color: #9aa5b3;
    font: 12px "Share Tech Mono", monospace;
    text-align: left;
    padding: 8px 10px;
    overflow: hidden;
    transition: transform .07s, box-shadow .07s;
  }
  .preset .num { font: 700 18px "Segoe UI", sans-serif; color: #dbe3ec; }
  .preset .legend { display: block; margin-top: 2px; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: color-mix(in srgb, var(--c) 45%, #6b7686); }
  .preset::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: #0b0d10; }
  .preset.active { transform: translateY(4px); box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 1px 0 #050608; }
  .preset.active::before { background: var(--c); box-shadow: 0 0 10px var(--c); }
  .preset.active .legend { color: var(--c); text-shadow: 0 0 6px color-mix(in srgb, var(--c) 70%, transparent); }
  .preset .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: color-mix(in srgb, var(--c) 30%, transparent); pointer-events: none; }
  .preset span { position: relative; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="unit">
    <div class="face">
      <div class="silk" style="top:16px;left:26px">HEADPHONES · MIC · STATIONS</div>
      <div class="badge"><img src="logo/icon-v1.png" alt="">Canary<span>EQ</span></div>

      <div class="left">
        <div class="ring" id="volume">
          <div class="knob"><div class="dot" id="volume-dot"></div></div>
        </div>
        <div class="knob-label">VOLUME</div>
      </div>

      <div class="bezel">
        <div class="lcd">
          <div class="lcd-top"><span>HEADPHONES · DAWN PRO · 48KHZ</span><span id="memory">MEMORY 1</span></div>
          <div class="lcd-main">
            <div class="freq" id="freq">88.4</div>
            <div class="line"><span class="name" id="name">DAWN PRO</span><span class="sub">♪ HATE THAT I MADE YOU LOVE ME</span></div>
            <div class="tags"><span class="on">ST</span><span class="on">EQ</span><span class="on">LIM</span><span id="edited">EDIT</span></div>
          </div>
          <div class="bars" id="bars"></div>
          <div class="scale" id="scale"><div class="needle" id="needle"></div></div>
          <div class="overlay" id="overlay"></div>
        </div>
      </div>

      <div class="right">
        <div class="tone"><div class="small-knob" data-key="bass"><div class="mark"></div></div><div class="tone-text"><b>BASS</b><small>kick, rumble</small><output id="bass-out"></output></div></div>
        <div class="tone"><div class="small-knob" data-key="vocals"><div class="mark"></div></div><div class="tone-text"><b>VOCALS</b><small>voices, snare</small><output id="vocals-out"></output></div></div>
        <div class="tone"><div class="small-knob" data-key="treble"><div class="mark"></div></div><div class="tone-text"><b>TREBLE</b><small>air, cymbals</small><output id="treble-out"></output></div></div>
      </div>

      <div class="balance">
        <label>BALANCE</label>
        <div class="track" id="balance">
          <div class="numbers"><span>L</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>R</span></div>
          <div class="thumb" id="thumb"></div>
        </div>
        <span></span>
      </div>

      <div class="presets" id="presets"></div>
    </div>
  </div>
</div>

<script>
  const HOLD_MS = 1500;
  const presets = [
    { freq: "88.4", name: "DAWN PRO", color: "#ff7fb6", eq: { bass: 0.8, vocals: 0.3, treble: -1.0 } },
    { freq: "91.2", name: "LATE NIGHT", color: "#d7dde6", eq: { bass: 1.5, vocals: -0.7, treble: -3.7 } },
    { freq: "94.7", name: "VALORANT", color: "#ff6153", eq: { bass: -1.0, vocals: 2.0, treble: 1.5 } },
    { freq: "99.1", name: "PODCASTS", color: "#5fd38a", eq: { bass: -2.0, vocals: 3.0, treble: 0.0 } },
    { freq: "103.5", name: "DISCORD", color: "#9b8cff", eq: { bass: -1.0, vocals: 1.5, treble: 0.5 } },
    { freq: "107.0", name: "MY MIX", color: "#ffb340", eq: { bass: 2.0, vocals: 0.0, treble: 1.5 } },
  ];
  const state = { active: 0, volume: -8, balance: 0, eq: { ...presets[0].eq } };
  const signed = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}`;
  const $ = id => document.getElementById(id);

  const bars = Array.from({ length: 48 }, () => $("bars").appendChild(document.createElement("i")));
  presets.forEach((preset, i) => {
    const label = document.createElement("span");
    label.style.left = `${4 + i * 18.4}%`;
    label.textContent = preset.name;
    $("scale").appendChild(label);
  });

  let overlayTimer = null;
  const showOverlay = text => {
    $("overlay").textContent = text;
    $("overlay").classList.add("show");
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => $("overlay").classList.remove("show"), 900);
  };

  const render = () => {
    const preset = presets[state.active];
    document.documentElement.style.setProperty("--station", preset.color);
    $("freq").textContent = preset.freq;
    $("name").textContent = preset.name;
    $("memory").textContent = `MEMORY ${state.active + 1}`;
    $("needle").style.left = `${4 + state.active * 18.4}%`;
    $("scale").querySelectorAll("span").forEach((s, i) => s.classList.toggle("on", i === state.active));
    const edited = Object.keys(state.eq).some(k => Math.abs(state.eq[k] - preset.eq[k]) > 0.05);
    $("edited").classList.toggle("on", edited);
    for (const key of ["bass", "vocals", "treble"]) {
      $(`${key}-out`).textContent = `${signed(state.eq[key])} dB`;
      document.querySelector(`.small-knob[data-key="${key}"] .mark`).style.transform = `rotate(${state.eq[key] / 12 * 135}deg)`;
    }
    const level = (state.volume + 40) / 46;
    $("volume").style.setProperty("--level", level.toFixed(3));
    $("volume-dot").style.transform = `rotate(${-135 + level * 270}deg)`;
    $("thumb").style.left = `calc(14px + ${(state.balance + 5) / 10} * (100% - 28px))`;
    document.querySelectorAll(".preset").forEach((p, i) => p.classList.toggle("active", i === state.active));
  };

  const dragVertical = (element, onDelta) => {
    element.addEventListener("pointerdown", event => {
      element.setPointerCapture(event.pointerId);
      let last = event.clientY;
      const move = e => { onDelta(last - e.clientY); last = e.clientY; render(); };
      element.addEventListener("pointermove", move);
      element.addEventListener("pointerup", () => element.removeEventListener("pointermove", move), { once: true });
    });
    element.addEventListener("wheel", event => { event.preventDefault(); onDelta(-event.deltaY / 4); render(); }, { passive: false });
  };

  dragVertical($("volume"), d => {
    state.volume = Math.max(-40, Math.min(6, Math.round((state.volume + d * 0.25) * 2) / 2));
    showOverlay(`VOL ${signed(state.volume)}`);
  });
  document.querySelectorAll(".small-knob").forEach(knob => {
    const key = knob.dataset.key;
    dragVertical(knob, d => {
      state.eq[key] = Math.max(-12, Math.min(12, Math.round((state.eq[key] + d * 0.08) * 2) / 2));
      showOverlay(`${key.toUpperCase()} ${signed(state.eq[key])}`);
    });
    knob.addEventListener("dblclick", () => { state.eq[key] = 0; render(); showOverlay(`${key.toUpperCase()} 0.0`); });
  });

  const setBalance = e => {
    const rect = $("balance").getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (e.clientX - rect.left - 14) / (rect.width - 28)));
    state.balance = Math.round(ratio * 10 - 5);
    render();
    showOverlay(state.balance === 0 ? "BAL CENTER" : `BAL ${state.balance < 0 ? "L" : "R"}${Math.abs(state.balance)}`);
  };
  $("balance").addEventListener("pointerdown", e => {
    $("balance").setPointerCapture(e.pointerId);
    setBalance(e);
    $("balance").addEventListener("pointermove", setBalance);
    $("balance").addEventListener("pointerup", () => $("balance").removeEventListener("pointermove", setBalance), { once: true });
  });
  $("balance").addEventListener("dblclick", () => { state.balance = 0; render(); showOverlay("BAL CENTER"); });

  presets.forEach((preset, index) => {
    const button = document.createElement("button");
    button.className = "preset";
    button.style.setProperty("--c", preset.color);
    button.innerHTML = `<div class="fill"></div><span class="num">${index + 1}</span><span class="legend">${preset.freq} ${preset.name}</span>`;
    const fill = button.querySelector(".fill");
    let start = 0, saved = false, frame = null;
    const tick = () => {
      const progress = Math.min(1, (performance.now() - start) / HOLD_MS);
      fill.style.width = `${progress * 100}%`;
      if (progress >= 1) {
        saved = true;
        presets[index].eq = { ...state.eq };
        state.active = index;
        render();
        showOverlay(`★ MEMORY ${index + 1} SAVED`);
        return;
      }
      frame = requestAnimationFrame(tick);
    };
    button.addEventListener("pointerdown", () => { start = performance.now(); saved = false; frame = requestAnimationFrame(tick); });
    button.addEventListener("pointerup", () => {
      cancelAnimationFrame(frame);
      fill.style.width = "0";
      if (start && !saved) {
        state.active = index;
        state.eq = { ...presets[index].eq };
        render();
        showOverlay(`${presets[index].freq} ${presets[index].name}`);
      }
      start = 0;
    });
    button.addEventListener("pointerleave", () => { cancelAnimationFrame(frame); fill.style.width = "0"; start = 0; });
    $("presets").appendChild(button);
  });

  let t = 0;
  const animate = () => {
    t += 0.045;
    bars.forEach((bar, i) => {
      const band = i / bars.length;
      const tilt = band < 0.3 ? state.eq.bass : band < 0.65 ? state.eq.vocals : state.eq.treble;
      const base = 0.3 + 0.4 * Math.abs(Math.sin(t * (1.2 + band * 2.6) + i * 0.6)) * (1 - band * 0.45);
      bar.style.height = `${Math.max(6, Math.min(100, base * Math.pow(10, tilt / 30) * 100))}%`;
    });
    requestAnimationFrame(animate);
  };

  const fit = () => {
    const scale = Math.min(1, (innerWidth - 20) / 1080, (innerHeight - 20) / 490);
    $("stage").style.transform = `translate(-50%, -50%) scale(${scale})`;
  };
  addEventListener("resize", fit);
  fit();

  const params = new URLSearchParams(location.search);
  if (params.has("press")) { state.active = Number(params.get("press")); state.eq = { ...presets[state.active].eq }; }
  if (params.has("balance")) state.balance = Number(params.get("balance"));
  if (params.has("edited")) state.eq.bass = 4.5;
  render();
  animate();
  if (params.has("overlay")) showOverlay(params.get("overlay"));
</script>
</body>
</html>
